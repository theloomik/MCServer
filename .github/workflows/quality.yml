name: Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests (Windows)
    # MCServer is a Windows desktop application; Job Object tests only run here.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked development dependencies
        run: uv sync --all-groups --locked
      - name: Check formatting
        run: uv run ruff format --check src tests tools
      - name: Lint
        run: uv run ruff check src tests tools
      - name: Type-check
        run: uv run mypy src/mcserver
      - name: Test with coverage report (real-server smoke tests are skipped without MCSERVER_TEST_JAR)
        run: uv run pytest --cov=mcserver --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Scan for security issues
        run: uv run bandit -q -r src/mcserver
