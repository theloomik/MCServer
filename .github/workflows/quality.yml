name: Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-quality:
    name: MCServer 2.0 quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked development dependencies
        run: uv sync --all-groups --locked
      - name: Check formatting of v2 code
        run: uv run ruff format --check src tests/unit
      - name: Lint v2 code
        run: uv run ruff check src tests/unit
      - name: Type-check Domain and Application layers
        run: uv run mypy src/mcserver/domain src/mcserver/application
      - name: Test Domain and Application layers
        run: uv run pytest tests/unit/domain tests/unit/application
      - name: Scan v2 source for security issues
        run: uv run bandit -r src/mcserver

  legacy-regression:
    name: Legacy regression suite
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install locked development dependencies
        run: uv sync --all-groups --locked
      - name: Scan legacy source for security issues
        run: uv run bandit -q -r core.py services.py -c pyproject.toml
      - name: Run complete regression suite
        run: uv run pytest
