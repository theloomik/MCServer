name: MCServer 2.0 quality

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Ruff lint
        run: uv run ruff check src tests/unit
      - name: Ruff formatting
        run: uv run ruff format --check src tests/unit
      - name: Mypy domain and application
        run: uv run mypy src/mcserver/domain src/mcserver/application
      - name: Domain and application unit tests
        run: uv run pytest tests/unit/domain tests/unit/application
      - name: Bandit new source
        run: uv run bandit -r src/mcserver
