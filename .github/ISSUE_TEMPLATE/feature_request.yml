name: Feature request
description: An idea that would make MCServer better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to do and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could MCServer help?
      description: Your idea of how it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead now?
