[project]
name = "mcserver"
version = "2.0.0a1"
description = "Windows desktop application for managing Minecraft servers."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["psutil>=6,<8", "PySide6>=6.8,<7"]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-qt>=4.5,<5",
    "pyinstaller>=6,<7",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mcserver.domain", "mcserver.domain.*"]
strict = true

[[tool.mypy.overrides]]
module = ["mcserver.application", "mcserver.application.*"]
strict = true

[[tool.mypy.overrides]]
# PySide6 stubs mis-type most enum members as missing; suppress attr-defined/call-overload
# for all modules that directly import from PySide6.
module = ["styles", "widgets", "ui", "pages.*"]
disable_error_code = ["attr-defined", "call-overload", "assignment", "union-attr", "index", "var-annotated", "has-type"]
